<svg width="100%" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flujo de automatización: correo, IA, acción, negocio">
  <defs>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0527a"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <line x1="150" y1="70" x2="1050" y2="70" stroke="#2a2a35" stroke-width="3"/>
  <line x1="150" y1="70" x2="1050" y2="70" stroke="url(#flowGrad)" stroke-width="3"
        stroke-dasharray="14 20" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="1.4s" repeatCount="indefinite"/>
  </line>

  <g text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="150" cy="70" r="24" fill="#1b1b22" stroke="#f0527a" stroke-width="3"/>
    <text x="150" y="120" fill="#a9a7b5" font-size="15">Correo</text>

    <circle cx="450" cy="70" r="24" fill="#1b1b22" stroke="#7c5cff" stroke-width="3">
      <animate attributeName="r" values="24;28;24" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="450" y="120" fill="#a9a7b5" font-size="15">IA</text>

    <circle cx="750" cy="70" r="24" fill="#1b1b22" stroke="#f0527a" stroke-width="3"/>
    <text x="750" y="120" fill="#a9a7b5" font-size="15">Acción</text>

    <circle cx="1050" cy="70" r="24" fill="#1b1b22" stroke="#7c5cff" stroke-width="3">
      <animate attributeName="r" values="24;28;24" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <text x="1050" y="120" fill="#a9a7b5" font-size="15">Negocio</text>
  </g>
</svg>
