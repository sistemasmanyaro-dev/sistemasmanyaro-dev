<svg width="100%" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Orquestador de IA coordinando tres agentes dentro de una agencia de IA">
  <defs>
    <linearGradient id="spoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#f0527a"/>
    </linearGradient>
  </defs>

  <text x="450" y="18" text-anchor="middle" fill="#7c5cff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">AGENCIA DE IA</text>

  <!-- base spokes -->
  <line x1="450" y1="60" x2="180" y2="190" stroke="#2a2a35" stroke-width="3"/>
  <line x1="450" y1="60" x2="450" y2="190" stroke="#2a2a35" stroke-width="3"/>
  <line x1="450" y1="60" x2="720" y2="190" stroke="#2a2a35" stroke-width="3"/>

  <!-- animated spokes: signal traveling from orchestrator to each agent -->
  <line x1="450" y1="60" x2="180" y2="190" stroke="url(#spoke)" stroke-width="3" stroke-dasharray="10 16" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.3s" repeatCount="indefinite"/>
  </line>
  <line x1="450" y1="60" x2="450" y2="190" stroke="url(#spoke)" stroke-width="3" stroke-dasharray="10 16" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.3s" begin="0.25s" repeatCount="indefinite"/>
  </line>
  <line x1="450" y1="60" x2="720" y2="190" stroke="url(#spoke)" stroke-width="3" stroke-dasharray="10 16" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.3s" begin="0.5s" repeatCount="indefinite"/>
  </line>

  <g text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a9a7b5">
    <circle cx="450" cy="60" r="27" fill="#1b1b22" stroke="#7c5cff" stroke-width="3">
      <animate attributeName="r" values="27;31;27" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="450" y="68" fill="#ffffff" font-size="13" font-weight="600">IA</text>
    <text x="450" y="110" font-size="14">Orquestador</text>

    <circle cx="180" cy="190" r="22" fill="#1b1b22" stroke="#f0527a" stroke-width="3"/>
    <text x="180" y="232" font-size="14">Agente</text>

    <circle cx="450" cy="190" r="22" fill="#1b1b22" stroke="#f0527a" stroke-width="3"/>
    <text x="450" y="232" font-size="14">Agente</text>

    <circle cx="720" cy="190" r="22" fill="#1b1b22" stroke="#f0527a" stroke-width="3"/>
    <text x="720" y="232" font-size="14">Agente</text>
  </g>
</svg>
